# No secrets here. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put SHARED_SECRET
#   npx wrangler secret put API_KEYS              (v1 clients: "constitutions:<key>,atlas:<key>")
#   npx wrangler secret put TURNSTILE_SECRET      (optional; with TURNSTILE_SITE_KEY below)
# Local development reads the same names from .dev.vars.
name = "normalcy"
main = "src/index.ts"
compatibility_date = "2025-07-18"
account_id = "5e824d51422aaa1efe515f8b76c73be3"
workers_dev = true

# Zone routes in front of the existing proxied DNS records (DNS and mail records untouched)
routes = [
  { pattern = "normalcy.is/*", zone_name = "normalcy.is" },
  { pattern = "www.normalcy.is/*", zone_name = "normalcy.is" },
]

# The site: benchmark library, checker and audits (public/). Matching files are
# served directly; everything else (/api/*, /check, ...) reaches the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Cached check results (keyed by content hash + rubric + benchmark + model)
[[kv_namespaces]]
binding = "CACHE"
id = "89fad098378749d0b4bf41de9a4094eb"

# Public checker: 5 model calls per IP per minute
[[unsafe.bindings]]
name = "CHECK_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
# Public Turnstile site key; leave empty to run the checker without a challenge
TURNSTILE_SITE_KEY = ""
